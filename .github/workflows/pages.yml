name: pages

# Publishes the GitHub Pages site: the TypeDoc API reference under /api, the
# rendered docs/*.md under /docs (engine#152), and the schema artifacts under
# /schema, so the schema $id URLs
# (https://astrapi69.github.io/learn-content-engine/schema/*.json) resolve.
#
# The site loads nothing from a third-party host (engine#272): the assembled
# _site is scanned before it is uploaded, and ci.yml runs the same assembly
# and scan on every pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run docs:pages builds the API docs (TypeDoc) and the docs site
      # (Markdown to HTML) and assembles _site: landing page + /api + /docs +
      # the schema at its $id path. ci.yml runs the same script on every PR.
      - name: Build and assemble the site (npm run docs:pages)
        run: npm run docs:pages

      - name: Third-party host gate (nothing on the site loads from another host)
        run: npm run docs:pages:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
