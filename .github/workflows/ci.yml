name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shipped Python helper (python/lce_schema.py, engine#115) is
      # verified by running the real Python against the real schema. Without
      # these libraries those tests SKIP, and a skipped gate looks exactly
      # like a passing one - so they are installed here on purpose.
      - name: Set up Python (for the shipped validator helper)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        run: pip install "jsonschema>=4,<5" regex

      - name: Lesson-types drift gate (regenerate from schema, expect no diff)
        run: node scripts/generate-lesson-types.mjs --check

      - name: Schema-diagram drift gate (regenerate from schema, expect no diff)
        run: node scripts/generate-schema-diagrams.mjs --check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size gate (core and qti measured separately, parse-xml must not leak into core)
        run: node scripts/check-bundle-size.mjs

      - name: API docs drift gate (TypeDoc build stays green, warnings are errors)
        run: npm run docs:api:check
